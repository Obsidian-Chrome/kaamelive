<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaamelive</title>
  <link rel="icon" type="image/png" href="kaamelott_logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="player" class="player">
    <video id="video" class="video" playsinline preload="auto"></video>

    <div id="overlay" class="overlay active">

      <!-- ── Top bar ─────────────────────────────────────────── -->
      <div class="overlay-top">
        <div class="top-left">
          <h1 class="brand">Kaamelive</h1>
          <p id="episode-title" class="episode-title"></p>
        </div>

        <!-- Compteur de viewers (visible seulement quand le serveur local tourne) -->
        <div id="viewer-badge" class="viewer-badge" style="display:none">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
          </svg>
          <span id="viewer-count">1</span>
        </div>

      </div>

      <!-- ── Centre ─────────────────────────────────────────── -->
      <div class="overlay-center">

        <!-- Bouton de lancement initial -->
        <button id="start-btn" class="start-btn" type="button">
          <!-- play icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
          </svg>
          Lancer le stream
        </button>


      </div>

      <!-- ── Contrôles bas ───────────────────────────────────── -->
      <div id="overlay-bottom" class="overlay-bottom">

        <!-- Timeline -->
        <div class="timeline-row">
          <span id="time-current" class="time-label">0:00</span>
          <div class="timeline-track">
            <div id="timeline-fill" class="timeline-fill"></div>
            <div id="timeline-dot"  class="timeline-dot"></div>
          </div>
          <span id="time-total" class="time-label time-label--right">0:00</span>
        </div>

        <div class="controls-bar">

          <!-- Play / Pause -->
          <button id="play-btn" class="ctrl-btn" type="button" aria-label="Lecture/Pause">
            <svg id="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <svg id="icon-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
          </button>

          <span class="sep"></span>

          <!-- Volume -->
          <div class="volume-group">
            <button id="mute-btn" class="mute-btn" type="button" aria-label="Couper / Rétablir le son">
              <!-- icône son activé -->
              <svg id="icon-vol-on" width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
              </svg>
              <!-- icône son coupé -->
              <svg id="icon-vol-off" width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
              </svg>
            </button>
            <input id="volume" class="volume-slider" type="range"
                   min="0" max="1" step="0.02" value="0.2" aria-label="Volume">
          </div>

          <span class="sep"></span>

          <!-- Plein écran -->
          <button id="fullscreen-btn" class="ctrl-btn" type="button" aria-label="Plein écran">
            <svg id="icon-fs-enter" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
            </svg>
            <svg id="icon-fs-exit" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none">
              <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
            </svg>
          </button>

        </div>
      </div>

    </div><!-- /overlay -->
  </div><!-- /player -->

  <script src="app.js"></script>
</body>
</html>
