<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaamelive</title>
  <link rel="icon" type="image/png" href="kaamelott_logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="player" class="player">
    <video id="video" class="video" playsinline preload="auto"></video>

    <!-- Spinner de chargement -->
    <div id="loading-spinner" class="loading-spinner">
      <div class="spinner-ring"></div>
    </div>

    <div id="overlay" class="overlay active">

      <!-- ── Top bar ─────────────────────────────────────────── -->
      <div class="overlay-top">
        <div class="top-left">
          <h1 class="brand">Kaamelive</h1>
          <p id="episode-title" class="episode-title"></p>
        </div>

        <!-- Compteur de viewers (visible seulement quand le serveur local tourne) -->
        <div id="viewer-badge" class="viewer-badge" style="display:none">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
          </svg>
          <span id="viewer-count">1</span>
        </div>

      </div>

      <!-- ── Centre ─────────────────────────────────────────── -->
      <div class="overlay-center">

        <!-- Bouton de lancement initial -->
        <button id="start-btn" class="start-btn" type="button">
          <!-- play icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
          </svg>
          Lancer le stream
        </button>


      </div>

      <!-- ── Contrôles bas ───────────────────────────────────── -->
      <div id="overlay-bottom" class="overlay-bottom">

        <!-- Timeline -->
        <div class="timeline-row">
          <span id="time-current" class="time-label">0:00</span>
          <div class="timeline-track">
            <div id="timeline-fill" class="timeline-fill"></div>
            <div id="timeline-dot"  class="timeline-dot"></div>
          </div>
          <span id="time-total" class="time-label time-label--right">0:00</span>
        </div>

        <div class="controls-bar">

          <!-- Play / Pause -->
          <button id="play-btn" class="ctrl-btn" type="button" aria-label="Lecture/Pause">
            <svg id="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <svg id="icon-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
          </button>

          <span class="sep"></span>

          <!-- Volume -->
          <div class="volume-group">
            <button id="mute-btn" class="mute-btn" type="button" aria-label="Couper / Rétablir le son">
              <!-- icône son activé -->
              <svg id="icon-vol-on" width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
              </svg>
              <!-- icône son coupé -->
              <svg id="icon-vol-off" width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
              </svg>
            </button>
            <input id="volume" class="volume-slider" type="range"
                   min="0" max="1" step="0.02" value="0.2" aria-label="Volume">
          </div>

          <span class="sep"></span>

          <!-- Plein écran -->
          <button id="fullscreen-btn" class="ctrl-btn" type="button" aria-label="Plein écran">
            <svg id="icon-fs-enter" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
            </svg>
            <svg id="icon-fs-exit" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none">
              <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
            </svg>
          </button>

        </div>
      </div>

    </div><!-- /overlay -->
  </div><!-- /player -->

  <!-- ═══════════════════════════════ CHAT ════════════════════════════════ -->

  <!-- Pseudo modal -->
  <div id="pseudo-modal" class="pseudo-modal">
    <div class="pseudo-box">
      <p class="pseudo-title">Choisir un pseudo</p>
      <input id="pseudo-input" class="pseudo-input" type="text"
             placeholder="Votre pseudo…" maxlength="20"
             autocomplete="off" spellcheck="false">
      <div class="pseudo-actions">
        <button id="pseudo-confirm" class="pseudo-confirm-btn" type="button">Rejoindre</button>
        <button id="pseudo-cancel"  class="pseudo-cancel-btn"  type="button">Annuler</button>
      </div>
    </div>
  </div>

  <!-- Bouton notifications (à côté de la bulle) -->
  <button id="notif-btn" class="notif-bubble-btn" type="button" style="display:none">
    <svg id="icon-bell-on" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
    </svg>
    <svg id="icon-bell-off" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none">
      <path d="M20 18.69L7.84 6.14 5.27 3.49 4 4.76l2.8 2.8v.01c-.52.99-.8 2.16-.8 3.42V16l-2 2v1h13.73l2 2L20 19.69zM12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-7.32V11c0-3.08-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68c-.29.07-.56.18-.83.28L18 13.68z"/>
    </svg>
  </button>

  <!-- Bulle chat -->
  <button id="chat-bubble" class="chat-bubble" type="button" aria-label="Ouvrir le chat" style="display:none">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
    </svg>
    <span id="chat-unread" class="chat-unread" style="display:none">0</span>
  </button>

  <!-- Panel chat -->
  <div id="chat-panel" class="chat-panel">

    <div class="chat-header">
      <span class="chat-header-title">Chat</span>
      <div class="chat-header-actions">
        <!-- changer de pseudo -->
        <button id="pseudo-change" class="chat-header-btn" type="button" title="Changer de pseudo">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
          </svg>
        </button>
        <!-- fermer -->
        <button id="chat-close" class="chat-header-btn" type="button" aria-label="Fermer le chat">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="chat-messages" class="chat-messages"></div>

    <!-- Emoji picker (grille, toggle) -->
    <div id="emoji-picker" class="emoji-picker"></div>

    <div class="chat-input-area">
      <button id="emoji-btn" class="emoji-toggle-btn" type="button" aria-label="Emojis">😊</button>
      <input id="chat-input" class="chat-text-input" type="text"
             placeholder="Message…" maxlength="200"
             autocomplete="off" spellcheck="false" disabled>
      <button id="chat-send" class="chat-send-btn" type="button" aria-label="Envoyer" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>

  </div><!-- /chat-panel -->

  <script src="app.js"></script>
</body>
</html>
